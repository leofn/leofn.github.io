{{- $currentLang := .Language.Lang -}}
<span class="lang-switch not-selectable">
    {{- range .Site.Languages }}
        {{- if eq .Lang $currentLang }}
            <span class="lang-current">{{ index (split .Lang "-") 0 }}</span>
        {{- else }}
            <a href="{{ $.Site.BaseURL }}{{ if ne .Lang $.Site.Params.defaultContentLanguage }}{{ .Lang }}/{{ end }}" title="{{ .LanguageName }}">{{ index (split .Lang "-") 0 }}</a>
        {{- end }}
    {{- end }}
</span>
