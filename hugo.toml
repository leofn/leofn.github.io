baseURL = "https://leofn.com/"
title   = "Leonardo F. Nascimento"
languageCode = "en-us"
theme = "hello-friend-ng"

enableRobotsTXT = true
enableEmoji     = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

PygmentsCodeFences = true
PygmentsStyle      = "monokai"

[pagination]
  pagerSize = 10

[params]
