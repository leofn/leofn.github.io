  [params.author]
    name = "Leonardo F. Nascimento"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ leofn"
    logoHomeLink = "/"

  [params.footer]
    trademark = 2026
    rss       = false
    copyright = true
