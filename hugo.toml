  homeSubtitle = "Computational Social Scientist at UFBA"

  enableThemeToggle    = true
  enableSharingButtons = false
  enableReadingTime    = false

  customCSS = []
  customJS  = []

  [params.portrait]
    path     = "/img/profile.webp"
    alt      = "Leonardo F. Nascimento"
