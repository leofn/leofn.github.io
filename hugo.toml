baseURL = "https://leofn.com/"
title   = "Leonardo F. Nascimento"
languageCode = "en-us"
theme = "hello-friend-ng"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji     = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

PygmentsCodeFences = true
PygmentsStyle      = "monokai"

[pagination]
  pagerSize = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  description = "Computational Social Scientist at UFBA"
  keywords    = "sociology, computational social science, digital methods, UFBA"
  images      = [""]

  homeSubtitle = "Computational Social Scientist at UFBA"

  enableThemeToggle    = true
  enableSharingButtons = false
  enableReadingTime    = false

  customCSS = []
  customJS  = []

  [params.portrait]
    path     = "/img/profile.webp"
    alt      = "Leonardo F. Nascimento"
    maxWidth = "160px"

  [params.author]
    name = "Leonardo F. Nascimento"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ leofn"
    logoHomeLink = "/"

  [params.footer]
    trademark = 2026
    rss       = false
    copyright = true
    author    = true
    topText   = []
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Theme <a href=\"https://github.com/rhazdon/hugo-theme-hello-friend-ng\">Hello Friend NG</a>"
    ]

  [params.favicon.color]
    mask          = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme         = "#1b1c1d"

  [[params.social]]
    name = "github"
    url  = "https://github.com/leofn"

  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/leofn3"

  [[params.social]]
    name = "email"
    url  = "https://leofn.com/contact/"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/leofn-labhdufba/"

[languages]
  [languages.en]
    weight    = 1
    languageName = "English"
    languageCode = "en-us"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [languages.en.params]
      subtitle = "Computational Social Scientist at UFBA"

  [languages.pt-br]
    weight    = 2
    languageName = "Português"
    languageCode = "pt-br"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [languages.pt-br.params]
      subtitle = "Cientista Social Computacional na UFBA"

  [languages.es]
    weight    = 3
    languageName = "Español"
    languageCode = "es"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [languages.es.params]
      subtitle = "Cientista Social Computacional en la UFBA"

  [languages.zh]
    weight    = 4
    languageName = "中文"
    languageCode = "zh-cn"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [languages.zh.params]
      subtitle = "巴伊亚联邦大学计算社会科学家"

